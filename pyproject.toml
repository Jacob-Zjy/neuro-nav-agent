[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-nav-agent"
version = "0.1.0"
description = "Evidence-grounded, uncertainty-aware navigation for cognitive-health clinical trials."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jianya Zhao"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7", "seaborn>=0.12", "scikit-learn>=1.3"]
demo = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
neuronav = "neuronav.cli:main"

[tool.setuptools.packages.find]
include = ["neuronav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
