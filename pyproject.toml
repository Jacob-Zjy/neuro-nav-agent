[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medeval-dataops"
version = "0.1.0"
description = "A reproducible Chinese medical LLM evaluation and data-operations pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jianya Zhao"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<24",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
model = [
  "torch>=2.8,<2.12",
  "transformers>=4.51,<6",
  "safetensors>=0.4,<1",
]
analysis = [
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]
demo = ["streamlit>=1.40,<2"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["medevalops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

